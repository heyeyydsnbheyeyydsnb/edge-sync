name: diag
on:
  push:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: probe workers
        run: |
          set +e
          probe () {
            echo "=== \"
            curl -s -o /tmp/o -w "HTTP:%{http_code} size:%{size_download}\n" --max-time 30 "\"
            head -c 260 /tmp/o; echo; echo
          }
          probe "https://asset-meta.pajd1p4iry.workers.dev/"
          probe "https://asset-meta.heyeyydsnb.workers.dev/"
          probe "https://asset-meta.pajd1p4iry.workers.dev/x9k4mvz2q?sstp=vpn:vpn@127.0.0.1:1"
          probe "https://asset-meta.heyeyydsnb.workers.dev/x9k4mvz2q?sstp=vpn:vpn@127.0.0.1:1"